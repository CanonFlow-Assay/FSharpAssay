name: FsAssay Architectural Audit

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  fsassay-audit:
    name: FsAssay Design Review & Security Audit
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore Dependencies
        run: dotnet restore FsAssay.slnx

      - name: Build FsAssay Solution
        run: dotnet build FsAssay.slnx -c Release --no-restore

      - name: Run FsAssay Audit Engine
        run: |
          set +e
          dotnet run --project FsAssay.Runner -c Release -- \
            --out-sarif results.sarif \
            --ratecard-md ratecard.md \
            --material-html dashboard.html \
            ./FsAssay.slnx
          audit_status=$?
          set -e
          # Exit 1 means the audit completed and found violations. Keep the
          # evidence visible without confusing known debt with a tool failure.
          if [ "$audit_status" -ne 0 ] && [ "$audit_status" -ne 1 ]; then
            exit "$audit_status"
          fi

      - name: Upload SARIF to GitHub Code Scanning
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: results.sarif
          category: fsassay-architecture

      - name: Publish Markdown Rate Card to PR Job Summary
        run: cat ratecard.md >> $GITHUB_STEP_SUMMARY

      - name: Verify FsAssay executable regression suite
        run: dotnet run --project FsAssay.Tests/FsAssay.Tests.fsproj -c Release --no-build

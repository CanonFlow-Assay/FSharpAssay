name: Repository Audit

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read
  security-events: write

jobs:
  audit:
    runs-on: ubuntu-latest
    env:
      DOTNET_INSTALL_DIR: ${{ github.workspace }}/.dotnet
      FSASSAY_APPROVED_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify required locks before restore
        run: bash eng/assert-required-locks.sh

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.301'

      - name: Verify exact SDK
        run: test "$(dotnet --version)" = "10.0.301"

      - name: Restore locked audit graph
        run: dotnet restore FsAssay.slnx --locked-mode

      - name: Build audit graph
        run: dotnet build FsAssay.slnx --configuration Release --no-restore

      - name: Run repository self-audit
        run: |
          mkdir -p artifacts/audit
          run_audit() {
            local suffix="$1"
            set +e
            dotnet run --project FsAssay.Runner/FsAssay.Runner.fsproj --configuration Release --no-build -- \
              --out-json "artifacts/audit/results-${suffix}.json" \
              --out-sarif "artifacts/audit/results-${suffix}.sarif" \
              --out-toolchain "artifacts/audit/toolchain-${suffix}.json" \
              --ratecard-md "artifacts/audit/ratecard-${suffix}.md" \
              --material-html "artifacts/audit/dashboard-${suffix}.html" \
              ./FsAssay.slnx | tee "artifacts/audit/run-${suffix}.log"
            local audit_status=${PIPESTATUS[0]}
            set -e
            test "$audit_status" -eq 2
            grep -q '^Files scanned: 25$' "artifacts/audit/run-${suffix}.log"
            grep -q '^Skipped: 0$' "artifacts/audit/run-${suffix}.log"
            grep -q '^Failed: 0$' "artifacts/audit/run-${suffix}.log"
            grep -q '^Total Violations: 616$' "artifacts/audit/run-${suffix}.log"
            grep -q '^Authority outcome: Inconclusive$' "artifacts/audit/run-${suffix}.log"
            grep -q '^Authoritative: false$' "artifacts/audit/run-${suffix}.log"
            jq -e '
              .schemaVersion == "fsassay-authority-receipt/1.1.0" and
              .outcome == "Inconclusive" and .authoritative == false and
              .counts.projectsDiscovered == 6 and .counts.projectsLoaded == 4 and
              .counts.projectsUnsupported == 2 and .counts.eligibleFiles == 25 and
              .counts.analyzedFiles == 25 and .counts.compilerIncompleteFiles == 0 and
              (.tests | length) == 1 and .tests[0].status == "notRun" and
              (.findings | length) == 616 and
              (.reasons | length) == 2 and
              ([.reasons[] | select(.code == "project-unsupported")] | length) == 1 and
              ([.reasons[] | select(.code == "required-test-not-run")] | length) == 1 and
              ([.reasons[] | select(.code | startswith("required-rule-"))] | length) == 0 and
              ([.rules[] | select(.status == "completed")] | length) == 35 and
              ([.rules[] | select(.status == "unavailable")] | length) == 58 and
              (.policy.status == "loaded") and (.policy.snapshot.shapeContractVersion == "fsharp-shape/1.0.0") and
              .policy.snapshot.evaluationDate == "2026-08-03" and
              (.policy.snapshot.approvedBlockingRules | length) == 0 and
              (.policy.snapshot.advisoryRules | length) == 0 and
              (.policy.snapshot.experimentalRules | length) == 35 and
              (.policy.snapshot.prototypeRules | length) == 36 and
              (.policy.snapshot.dummyRules | length) == 22 and
              (.policy.snapshot.deprecatedRules | length) == 0 and
              (.policy.snapshot.removedRules | length) == 0 and
              (.policy.snapshot.requiredProjectClasses | length) == 4 and
              .policy.snapshot.requiredTests[0].minimumPassed == 92 and
              (.policyErrors | length) == 0 and (.evidenceErrors | length) == 0 and
              .policy.snapshot.baseline.identity == "none" and
              (.policy.snapshot.baseline.records | length) == 0 and
              (.appliedBaselineRecords | length) == 0 and (.appliedSuppressions | length) == 0 and
              (.toolchain.sdkVersion == "10.0.301") and
              ([.findings[].path] | all(startswith("/") | not))
            ' "artifacts/audit/results-${suffix}.json"
            jq -e '
              .runs[0].properties.outcome == "Inconclusive" and
              .runs[0].properties.authoritative == false and
              .runs[0].properties.findingCount == 616 and
              (.runs[0].properties.reasons | length) == 2 and
              (.runs[0].invocations[0].toolExecutionNotifications | length) == 2 and
              .runs[0].invocations[0].executionSuccessful == true
            ' "artifacts/audit/results-${suffix}.sarif"
          }
          run_audit first
          run_audit second
          for artifact in results.json results.sarif toolchain.json ratecard.md dashboard.html; do
            stem="${artifact%.*}"
            ext="${artifact##*.}"
            cmp "artifacts/audit/${stem}-first.${ext}" "artifacts/audit/${stem}-second.${ext}"
          done

      - uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: artifacts/audit/results-first.sarif
          category: fsassay-architecture

      - name: Publish rate card to job summary
        run: cat artifacts/audit/ratecard-first.md >> "$GITHUB_STEP_SUMMARY"

      - name: Verify final tracked-source integrity
        run: |
          bash eng/assert-required-locks.sh
          test -z "$(git status --porcelain --untracked-files=no)"

      - uses: actions/upload-artifact@v4
        with:
          name: repository-audit
          path: artifacts/audit/

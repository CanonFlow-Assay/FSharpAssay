name: Stable CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  stable:
    runs-on: ubuntu-latest
    env:
      DOTNET_INSTALL_DIR: ${{ github.workspace }}/.dotnet
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify required locks before restore
        run: bash eng/assert-required-locks.sh

      - name: Prove a missing required lock fails policy
        run: bash eng/assert-missing-lock-fails.sh

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.301'

      - name: Verify exact SDK
        run: test "$(dotnet --version)" = "10.0.301"

      - name: Restore locked stable graph
        run: dotnet restore FsAssay.Stable.slnx --locked-mode

      - name: Build stable surface
        run: dotnet build FsAssay.Stable.slnx --no-restore --configuration Release

      - name: Run ordinary test entry point
        run: bash eng/run-stable-tests.sh ordinary

      - name: Run direct executable entry point
        run: bash eng/run-stable-tests.sh direct

      - name: Prove zero tests fail
        run: bash eng/assert-zero-test-fails.sh

      - name: Prove locked restore rejects drift
        run: bash eng/assert-locked-restore.sh

      - name: Verify M1 claims
        run: bash eng/verify-m1-claims.sh

      - name: Pack inherited baseline identity
        run: dotnet pack FsAssay.Runner/FsAssay.Runner.fsproj --configuration Release --no-build --no-restore --output artifacts/package

      - name: Verify final tracked-source integrity
        run: |
          bash eng/assert-required-locks.sh
          test -z "$(git status --porcelain --untracked-files=no)"

      - uses: actions/upload-artifact@v4
        with:
          name: stable-qualification
          path: |
            artifacts/package/*.nupkg
            artifacts/test-results/*.log
            artifacts/restore/*.log

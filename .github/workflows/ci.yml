name: Stable CI

on:
  push:
    branches: [ main, 'uplift/**' ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read
  id-token: write
  attestations: write

jobs:
  stable:
    runs-on: ubuntu-latest
    env:
      DOTNET_INSTALL_DIR: ${{ github.workspace }}/.dotnet
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify required locks before restore
        run: bash eng/assert-required-locks.sh

      - name: Prove a missing required lock fails policy
        run: bash eng/assert-missing-lock-fails.sh

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.301'

      - name: Verify exact SDK
        run: test "$(dotnet --version)" = "10.0.301"

      - name: Restore locked stable graph
        run: dotnet restore FsAssay.Stable.slnx --locked-mode

      - name: Build stable surface
        run: dotnet build FsAssay.Stable.slnx --no-restore --configuration Release

      - name: Run ordinary test entry point
        run: bash eng/run-stable-tests.sh ordinary

      - name: Run direct executable entry point
        run: bash eng/run-stable-tests.sh direct

      - name: Prove zero tests fail
        run: bash eng/assert-zero-test-fails.sh

      - name: Prove locked restore rejects drift
        run: bash eng/assert-locked-restore.sh

      - name: Verify M1 claims
        run: bash eng/verify-m1-claims.sh

      - name: Verify M2 authority contract
        run: bash eng/verify-m2-contract.sh

      - name: Verify M3 Shape and rule admission contract
        run: bash eng/verify-m3-contract.sh

      - name: Verify M4 consumer and package contract
        run: bash eng/verify-m4-contract.sh

      - name: Qualify reproducible package and offline consumer
        env:
          FSASSAY_CANDIDATE_SHA: ${{ github.sha }}
        run: bash eng/qualify-m4-package.sh "$FSASSAY_CANDIDATE_SHA" artifacts/m4

      - name: Attest exact package artifact on candidate push
        if: github.event_name == 'push'
        id: package-attestation
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: artifacts/m4/FsAssay.Cli.1.0.4.nupkg

      - name: Verify GitHub package attestation and reconcile hash
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh attestation verify artifacts/m4/FsAssay.Cli.1.0.4.nupkg --repo "$GITHUB_REPOSITORY"
          test "$(sha256sum artifacts/m4/FsAssay.Cli.1.0.4.nupkg | cut -d' ' -f1)" = \
            "$(jq -r '.package.sha256' artifacts/m4/package-manifest.json)"

      - name: Verify final tracked-source integrity
        run: |
          bash eng/assert-required-locks.sh
          test -z "$(git status --porcelain --untracked-files=no)"

      - uses: actions/upload-artifact@v4
        with:
          name: stable-qualification
          path: |
            artifacts/m4/
            artifacts/test-results/*.log
            artifacts/restore/*.log
